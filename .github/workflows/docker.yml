name: Build & Deploy Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'frontend/Dockerfile'
      - 'api/Dockerfile'

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/fablrc/pumpkin-hub-frontend
  API_IMAGE: ghcr.io/fablrc/pumpkin-hub-api

jobs:

  # ── Build Frontend ────────────────────────────────────────────────────────
  build-frontend:
    name: Build image Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ── Déploiement Coolify ───────────────────────────────────────────────────
  deploy:
    name: Déclencher le redéploiement Coolify
    runs-on: ubuntu-latest
    needs: [build-frontend, build-api]
    if: success()

    steps:
      - name: Appel du webhook Coolify
        run: |
          curl --silent --fail --show-error \
            --request GET \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}"
